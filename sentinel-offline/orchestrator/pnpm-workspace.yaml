packages:
  - "."

allowBuilds:
  sqlite3: true
  better-sqlite3: true
  sharp: true
  '@parcel/watcher': set this to true or false
  '@scarf/scarf': set this to true or false
  '@sentry/node-cpu-profiler': set this to true or false
  '@sentry/node-native-stacktrace': set this to true or false
  agent-browser: set this to true or false
  cpu-features: set this to true or false
  isolated-vm: set this to true or false
  msgpackr-extract: set this to true or false
  oracledb: set this to true or false
  protobufjs: set this to true or false
  ssh2: set this to true or false

minimumReleaseAgeExclude:
  - '@n8n/n8n-nodes-langchain@2.32.4'
  - '@n8n/scheduler@1.1.2'
  - n8n-nodes-base@2.32.4
  - n8n@2.32.6
